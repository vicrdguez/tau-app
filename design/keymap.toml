note = "Normal: the block under the cursor. Visual: the selection, or the blocks it touches when it crosses markup."
keys = [{ mode = "n", ctx = "decision", seq = "<leader>mn" }, { mode = "v", ctx = "decision", seq = "<leader>mn" }]

[[command]]
id = "note.whole"
ex = "note-whole"
desc = "note on the whole basis"
tier = "local"
kind = "command"
ctx = ["decision"]
keys = [{ mode = "n", ctx = "decision", seq = "<leader>mw" }]

[[command]]
id = "note.next"
ex = "nnext"
desc = "next / prev note"
tier = "local"
kind = "motion"
object = "n"
jump = false
countable = true
ctx = ["decision"]
note = "Moves the document cursor to the next note's passage, in text order. Unprinted. The note on the whole is reached with ␣mw."
keys = [{ mode = "n", ctx = "decision", seq = "]n" }, { mode = "n", ctx = "decision", seq = "[n" }]

[[command]]
id = "draft.edit"
ex = "edit-draft"
desc = "edit note under cursor"
tier = "local"
kind = "command"
ctx = ["decision"]
keys = [{ mode = "n", ctx = "decision", seq = "i" }]

[[command]]
id = "draft.discard"
ex = "discard-draft"
desc = "discard note draft"
tier = "local"
kind = "command"
effect = "discard"
local_only = true
ctx = ["decision"]
keys = [{ mode = "n", ctx = "decision", seq = "dd" }]

[[command]]
id = "draft.undo"
ex = "undo"
desc = "undo draft change"
tier = "local"
kind = "command"
countable = true
ctx = ["reader"]
keys = [{ mode = "n", ctx = "reader", seq = "u" }]

[[command]]
id = "draft.redo"
ex = "redo"
desc = "redo draft change"
tier = "local"
kind = "command"
countable = true
ctx = ["reader"]
keys = [{ mode = "n", ctx = "reader", seq = "<C-r>" }]

# ───────────────────────────── answer (␣a): the decide tier ─────────────────────────────

[[command]]
id = "auth.answer"
ex = "answer"
desc = "◆ answer this decision"
tier = "decide"
kind = "command"
ctx = ["decision"]
wire = ["answer"]
repeatable = false
countable = false
note = "Opens the readback with the choices; y sends answer {basis, choice, annotations}. Off when the decision is not open, offline, or revoked."
keys = [{ mode = "n", ctx = "global", seq = "<leader>ad" }]

[[command]]
id = "auth.again"
ex = "answer-again"
desc = "◆ send the answer again"
tier = "decide"
kind = "command"
ctx = ["decision"]
wire = ["answer"]
repeatable = false
countable = false
note = "The one way to send an answer again, in that decision's view only, through the readback. Live when the decision is answered and its then task ended faulted (sends the record's own basis, choice and annotations), or when this device's answer has an unknown outcome (sends the stored body)."
keys = [{ mode = "n", ctx = "global", seq = "<leader>ar" }]

# ───────────────────────────── project (␣p) and option fields ─────────────────────────────

[[command]]
id = "project.bind"
ex = "bind"
desc = "bind a project"
tier = "write"
kind = "command"
ctx = ["global"]
wire = ["bind"]
note = "The bind float (name, working directory, a checklist of extensions where Tab toggles; zero extensions is valid), then a y/n confirm: a project can't be unbound."
keys = [{ mode = "n", ctx = "global", seq = "<leader>pb" }]

[[command]]
id = "project.add"
ex = "add-extensions"
desc = "add extensions"
tier = "write"
kind = "command"
ctx = ["global"]
wire = ["addExtensions"]
note = "The project the current view names, else the last one used on this device, else the picker asks first. A checklist of the server's extensions not in the project (Tab toggles), then a y/n confirm: an extension can't be removed."
keys = [{ mode = "n", ctx = "global", seq = "<leader>pa" }]

[[command]]
id = "project.options"
ex = "options"
desc = "this project's options"
tier = "local"
kind = "command"
jump = true
ctx = ["global"]
note = "The project the current view names, else the last one used on this device, else the picker asks first."
keys = [{ mode = "n", ctx = "global", seq = "<leader>po" }]

[[command]]
id = "list.filter_project"
ex = "filter-project"
desc = "filter list: project, state"
tier = "local"
kind = "command"
ctx = ["list"]
note = "Conversations, Timeline and Faults: a project; Conversations also a state (failed, running, idle). Each place keeps one filter, never global. Home and Projects have none. Opening a place from a Project view, or Home's more-failed-runs line, sets it."
keys = [{ mode = "n", ctx = "list", seq = "<leader>pf" }]

[[command]]
id = "field.edit"
ex = "edit-field"
desc = "edit option field"
tier = "local"
kind = "command"
ctx = ["project"]
note = "model: the model picker; enum: the choice picker; string and number: an inline editor; secret: a masked editor, never prefilled; boolean: toggles."
keys = [{ mode = "n", ctx = "project", seq = "i" }]

[[command]]
id = "field.reset"
ex = "reset"
desc = "reset field to default"
tier = "local"
kind = "command"
ctx = ["project"]
note = "A draft: :w sends it as null in the patch."
keys = [{ mode = "n", ctx = "project", seq = "dd" }, { mode = "n", ctx = "project", seq = "<leader>mr" }]

[[command]]
id = "options.save"
ex = "w"
desc = "save option drafts"
tier = "write"
kind = "command"
ctx = ["project"]
wire = ["setOptions"]
note = "One setOptions per extension with changed keys."
keys = [{ mode = "n", ctx = "project", seq = "<leader>ms" }]

[[command]]
id = "editor.newline"
ex = "-newline"
desc = "new line (continues a list)"
tier = "local"
kind = "command"
ctx = ["composer", "note", "start"]
note = "Enter in a multi-line editor is a new line, as typed text; Markdown list items continue. Sending is Cmd-Enter. In single-line editors (field, connect) Enter commits instead."
keys = [{ mode = "i", ctx = "composer", seq = "<CR>" }, { mode = "i", ctx = "note", seq = "<CR>" }, { mode = "i", ctx = "start", seq = "<CR>" }]

[[command]]
id = "field.commit"
ex = "-commit"
desc = "commit field, next field"
tier = "local"
kind = "command"
ctx = ["field"]
note = "In an option field: keeps the value as a draft. The bind float's fields have their own keys (bind.keys)."
keys = [{ mode = "i", ctx = "field", seq = "<CR>" }, { mode = "n", ctx = "field", seq = "<CR>" }]

[[command]]
id = "connect.submit"
ex = "connect"
desc = "connect and pair"
tier = "write"
kind = "command"
ctx = ["connect"]
wire = ["pair"]
note = "pair {code}, then POST /v1/ and projects. To a plain-HTTP URL on another machine, Enter opens the Confirm float first."
keys = [{ mode = "i", ctx = "connect", seq = "<CR>" }, { mode = "n", ctx = "connect", seq = "<CR>" }]

# ───────────────────────────── recover (␣r) ─────────────────────────────

[[command]]
id = "recover.outbox"
ex = "outbox"
desc = "outbox"
tier = "local"
kind = "command"
ctx = ["global"]
keys = [{ mode = "n", ctx = "global", seq = "<leader>ru" }]

[[command]]
id = "recover.retry"
ex = "retry"
desc = "retry the call, same body"
tier = "write"
kind = "command"
ctx = ["outbox", "conversation", "project"]
wire = ["input", "continue", "setModel", "setOptions", "bind", "addExtensions"]
note = "The outbox entry under the cursor, or the view's unknown outcome: the exact stored body and request ID. Never an answer: an answer entry reads 'open the decision to send it again' (␣ar there). Never a create either: the start page keeps its text and Cmd-Enter there tries again. setModel and setOptions entries restored after a restart can't be retried; set the value again where it lives."
keys = [{ mode = "n", ctx = "global", seq = "<leader>rt" }, { mode = "ob", ctx = "outbox", seq = "<leader>rt" }]

[[command]]
id = "recover.reconnect"
ex = "reconnect"
desc = "reconnect now"
tier = "local"
kind = "command"
ctx = ["global"]
keys = [{ mode = "n", ctx = "global", seq = "<leader>rc" }]

[[command]]
id = "recover.pair"
ex = "pair"
desc = "pair again"
tier = "local"
kind = "command"
ctx = ["global"]
note = "Opens Connect with the server URL kept. A revoked device name can't be reused: the owner pairs a new name on the server."
keys = [{ mode = "n", ctx = "global", seq = "<leader>rp" }]


# ───────────────────────────── modal key sets ─────────────────────────────

[[command]]
id = "readback.confirm"
ex = "-"
desc = "confirm"
tier = "local"
kind = "modal"
ctx = ["readback"]
note = "Counts only after the readback has been on screen for tau.client_ms.readback_arm (400 ms) and only for what it last drew; an earlier y is discarded and echoes 'read it first'. Auto-repeat and Enter never confirm; a click never confirms."
keys = [{ mode = "rb", ctx = "readback", seq = "y" }]

[[command]]
id = "readback.cancel"
ex = "-"
desc = "cancel"
tier = "local"
kind = "modal"
ctx = ["readback"]
keys = [{ mode = "rb", ctx = "readback", seq = "n" }, { mode = "rb", ctx = "readback", seq = "<Esc>" }, { mode = "rb", ctx = "readback", seq = "q" }, { mode = "rb", ctx = "readback", seq = "<C-c>" }]

[[command]]
id = "readback.pick"
ex = "-"
desc = "pick a choice"
tier = "local"
kind = "modal"
ctx = ["readback"]
note = "j k move the pick; 1–9 pick choice N while there are at most nine choices (past nine, j k only). Each pick redraws the float, and y then waits for that draw."
keys = [{ mode = "rb", ctx = "readback", seq = "j" }, { mode = "rb", ctx = "readback", seq = "k" },
        { mode = "rb", ctx = "readback", seq = "1" }, { mode = "rb", ctx = "readback", seq = "2" }, { mode = "rb", ctx = "readback", seq = "3" },
        { mode = "rb", ctx = "readback", seq = "4" }, { mode = "rb", ctx = "readback", seq = "5" }, { mode = "rb", ctx = "readback", seq = "6" },
        { mode = "rb", ctx = "readback", seq = "7" }, { mode = "rb", ctx = "readback", seq = "8" }, { mode = "rb", ctx = "readback", seq = "9" }]

[[command]]
id = "readback.details"
ex = "-"
desc = "read every note"
tier = "local"
kind = "modal"
ctx = ["readback"]
keys = [{ mode = "rb", ctx = "readback", seq = "K" }]

[[command]]
id = "confirm.keys"
ex = "-"
desc = "confirm or cancel"
tier = "local"
kind = "modal"
ctx = ["confirm"]
note = "The bind, add-extension and plain-HTTP pairing confirm. y goes on; n, Esc, q cancel. The badge reads READBACK in its plain form (not the answer's solid coral)."
keys = [{ mode = "rb", ctx = "confirm", seq = "y" }, { mode = "rb", ctx = "confirm", seq = "n" },
        { mode = "rb", ctx = "confirm", seq = "<Esc>" }, { mode = "rb", ctx = "confirm", seq = "q" }]

[[command]]
id = "hint.select"
ex = "-"
desc = "select label (moves cursor only)"
tier = "local"
kind = "modal"
ctx = ["hint"]
keys = [{ mode = "h", ctx = "hint", seq = "<label>" }, { mode = "h", ctx = "hint", seq = "<Esc>" }, { mode = "h", ctx = "hint", seq = "<BS>" }]

[[command]]
id = "peek.keys"
ex = "-"
desc = "peek float keys"
tier = "local"
kind = "modal"
ctx = ["peek"]
note = "K on a list row when the stage is under 1000 px, or on an open item in the sidebar: j k move that cursor and the float follows; Enter opens the row; K, q, Esc close. Every other key is inert. The badge reads PEEK."
keys = [{ mode = "ho", ctx = "peek", seq = "j" }, { mode = "ho", ctx = "peek", seq = "k" },
        { mode = "ho", ctx = "peek", seq = "<CR>" },
        { mode = "ho", ctx = "peek", seq = "K" }, { mode = "ho", ctx = "peek", seq = "q" }, { mode = "ho", ctx = "peek", seq = "<Esc>" }]

[[command]]
id = "picker.keys"
ex = "-"
desc = "picker keys"
tier = "local"
kind = "modal"
ctx = ["picker"]
note = "C-j C-k move the cursor (the fzf habit; in Normal mode they stay reserved for splits); C-n C-p page the preview; Enter chooses or confirms the checklist; Tab toggles the item under the cursor in a checklist (bind, add extensions); S-Tab goes back to the bind float's fields; Esc and C-c cancel."
keys = [{ mode = "c", ctx = "picker", seq = "<C-j>" }, { mode = "c", ctx = "picker", seq = "<C-k>" },
        { mode = "c", ctx = "picker", seq = "<C-n>" }, { mode = "c", ctx = "picker", seq = "<C-p>" },
        { mode = "c", ctx = "picker", seq = "<CR>" }, { mode = "c", ctx = "picker", seq = "<Tab>" }, { mode = "c", ctx = "picker", seq = "<S-Tab>" },
        { mode = "c", ctx = "picker", seq = "<Esc>" }, { mode = "c", ctx = "picker", seq = "<C-c>" }]

[[command]]
id = "bind.keys"
ex = "-"
desc = "bind float field keys"
tier = "local"
kind = "modal"
ctx = ["bind"]
note = "The bind float's name and working directory, in Insert: Tab and Enter go to the next field (from the last, to the checklist), S-Tab to the previous; C-w, C-u, BS edit; Esc goes to the checklist, whose Esc cancels (Esc Esc cancel). The fields have no Normal mode, so nothing outside the float ever acts."
keys = [{ mode = "i", ctx = "bind", seq = "<Tab>" }, { mode = "i", ctx = "bind", seq = "<S-Tab>" }, { mode = "i", ctx = "bind", seq = "<CR>" },
        { mode = "i", ctx = "bind", seq = "<Esc>" }, { mode = "i", ctx = "bind", seq = "<C-w>" }, { mode = "i", ctx = "bind", seq = "<C-u>" },
        { mode = "i", ctx = "bind", seq = "<BS>" }]

[[command]]
id = "reply.keys"
ex = "-"
desc = "reply float keys"
tier = "local"
kind = "modal"
ctx = ["reply"]
note = "The not-recorded reply an answer readback turns into: Esc and q close it. y and every other key are inert. The badge reads READBACK in its plain form."
keys = [{ mode = "rb", ctx = "reply", seq = "<Esc>" }, { mode = "rb", ctx = "reply", seq = "q" }]

[[command]]
id = "outbox.keys"
ex = "-"
desc = "outbox float keys"
tier = "local"
kind = "modal"
ctx = ["outbox"]
note = "j k move between entries; K shows an entry's whole body; Esc and q close. Its actions are ␣rt (recover.retry) and x (row.hide), bound in this context. The badge reads OUTBOX."
keys = [{ mode = "ob", ctx = "outbox", seq = "j" }, { mode = "ob", ctx = "outbox", seq = "k" }, { mode = "ob", ctx = "outbox", seq = "K" },
        { mode = "ob", ctx = "outbox", seq = "<Esc>" }, { mode = "ob", ctx = "outbox", seq = "q" }]

[[command]]
id = "server.keys"
ex = "-"
desc = "Server float keys"
tier = "local"
kind = "modal"
ctx = ["server"]
note = "j k scroll the streams; Esc and q close. :forget-server is named in the float and typed after closing it. The badge reads SERVER."
keys = [{ mode = "sv", ctx = "server", seq = "j" }, { mode = "sv", ctx = "server", seq = "k" },
        { mode = "sv", ctx = "server", seq = "<Esc>" }, { mode = "sv", ctx = "server", seq = "q" }]
