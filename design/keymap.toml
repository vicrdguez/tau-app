# tau desktop keymap: the one declarative table for the rune client and a future TUI.
# Semantics: reference/grammar.md. Lint rules: reference/grammar.md §12. Calls named in `wire`: client.md §4.
# Tiers: local (no server effect) · write (a call that changes server state) · decide (an answer: readback + y).
# Key syntax: <leader> <C-x> <M-x> <S-x> <D-x> (D = Cmd, GUI only) <CR> <Esc> <Tab> <BS>, printable keys otherwise.
# A <D-x> binding is an alias: its command always has a terminal-representable binding too (KL9).
# The placeholder <label> (hint label) appears only in kind = "modal" entries.
# Modes: n Normal · v Visual · i Insert · c picker/command line · h hint · rb readback, send-again, reply and confirm floats · ho the peek float · ob the outbox float · sv the Server float.
# A float that takes the keys is a root context: nothing of global acts under it, only its own keys (reference/grammar.md §3).
# Focus: the stage, the sidebar (context sidebar) or the top float holds the keys; only that region draws a coral cursor (reference/grammar.md §3).
# Extra rule KL4g (tools/keymap_answer_rule.py): a command whose wire includes "answer" is tier decide under <leader>a.

[meta]
schema = 1
leader = "<Space>"
whichkey_delay_ms = 300
hint_alphabet = "asdfghjkl"
jumplist_size = 100

[contexts]                         # child = parent; "" = root
global = ""
list = "global"                    # Home, Conversations, Timeline, Faults, Projects
sidebar = "list"                   # the sidebar while it has the keys: places, open items, Server
reader = "global"
conversation = "reader"
decision = "reader"
project = "reader"                 # the Project view's option fields
editor = "global"                  # editable text; never authority
composer = "editor"                # a conversation's input
note = "editor"                    # a decision note (range or whole)
field = "editor"                   # an option value in the Project view
connect = "editor"                 # the Connect screen's fields
start = "editor"                   # the start page's composer
hint = "global"
# Floats that take the keys: each a root of its own, so nothing of global passes (no leader, no :, no ⌘K under them).
picker = ""                        # palette, find, project, workflow (with the models), model, thinking, filter, the bind and add-extension checklists
bind = ""                          # the bind float's two text fields
readback = ""                      # the answer readback and send-again
reply = ""                         # the not-recorded reply an answer readback turns into
confirm = ""                       # the y/n float before bind, addExtensions and pairing over plain HTTP
outbox = ""                        # the outbox float
server = ""                        # the Server float
peek = ""                          # the K float over a list or an open item

[groups]                           # which-key labels (KL8)
"<leader>" = "leader"
"<leader>a" = "◇ answer"
"<leader>c" = "conversation"
"<leader>h" = "help"
"<leader>m" = "this view"
"<leader>o" = "open"
"<leader>p" = "project"
"<leader>r" = "recover"
"<leader>t" = "toggle"
"g" = "goto"
"z" = "view"
"d" = "draft"
"]" = "next"
"[" = "prev"

# Reserved builtin sets: local tier by definition, countable, used by KL2 for prefix checks.
[builtin]
reader_motions = ["j", "k", "h", "l", "w", "b", "e", "0", "$", "gg", "G", "{", "}", "(", ")", "H", "M", "L",
                  "<C-d>", "<C-u>", "<C-f>", "<C-b>", "<C-e>", "<C-y>", "zz", "zt", "zb", "zl", "zh", "n", "N", "*", "#", "/", "?",
                  "v", "V"]                # v V enter Visual in a reader (grammar §2)
list_motions = ["j", "k", "gg", "G", "<C-d>", "<C-u>", "n", "N", "/", "?"]
editor_normal = ["h", "j", "k", "l", "w", "b", "e", "W", "B", "E", "0", "^", "$", "gg", "G", "f", "t", "F", "T", ";", ",",
                 "d", "c", "y", "dd", "yy", "cc", "D", "C", "x", "p", "P", "J", "u", "<C-r>", ".", "v", "V",
                 "i", "a", "I", "A", "o", "O", "r", "n", "N", "/", "?", "%"]
editor_textobjects = ["iw", "aw", "ip", "ap", "is", "as", "i\"", "a\"", "i(", "a(", "i[", "a[", "i{", "a{", "iq", "aq", "ib", "ab"]
editor_insert = ["<Esc>", "jk", "<C-w>", "<C-u>", "<C-CR>", "<S-Tab>", "<C-t>", "<C-d>", "<C-j>", "<C-k>", "<C-f>", "<C-n>", "<C-p>", "<Tab>", "<BS>"]
visual = ["<Esc>"]                 # leaves Visual, in readers and editors
hint = ["<Esc>", "a", "s", "d", "f", "g", "h", "j", "k", "l"]
pending = ["<Esc>"]                # Esc cancels a pending prefix (the which-key head prints it as a chip)
timeout_ok = ["jk"]                # KL2's single exception: the Insert escape

# ───────────────────────────── global: the sidebar, finders, palette ─────────────────────────────

[[command]]
id = "sidebar.focus"
ex = "sidebar-focus"
desc = "focus the sidebar"
tier = "local"
kind = "command"
ctx = ["global"]
note = "Window left. A sidebar that is not drawn (hidden by choice, or under a 1000 px window) is drawn over the stage while it, or a float opened from it, has the keys; nothing reflows. In the sidebar: j k move, Enter or l opens the row in the stage and gives the stage the keys, x closes an open item, C-l, Esc or q go back."
keys = [{ mode = "n", ctx = "global", seq = "<C-h>", tui_alt = "<C-w>h" }]

[[command]]
id = "sidebar.leave"
ex = "stage-focus"
desc = "back to the stage"
tier = "local"
kind = "command"
ctx = ["sidebar"]
note = "Window right. Esc and q do the same in the sidebar (float.close)."
keys = [{ mode = "n", ctx = "sidebar", seq = "<C-l>" }]

[[command]]
id = "item.next"
ex = "bnext"
desc = "next / prev open item"
tier = "local"
kind = "motion"
object = "b"
jump = true
countable = true
ctx = ["global"]
note = "Cycles the sidebar's open items top to bottom, wrapping, from the item shown last when the stage shows a place; the places are not in the cycle."
keys = [{ mode = "n", ctx = "global", seq = "]b" }, { mode = "n", ctx = "global", seq = "[b" }]

[[command]]
id = "find.object"
ex = "find"
desc = "find anything"
tier = "local"
kind = "command"
ctx = ["global"]
note = "Projects, conversations by label, open decisions by title, events by text. Prefixes p: c: d: e: narrow the kind."
keys = [{ mode = "n", ctx = "global", seq = "<leader>." }]

[[command]]
id = "palette"
ex = "commands"
desc = "commands"
tier = "local"
kind = "command"
ctx = ["global"]
keys = [{ mode = "n", ctx = "global", seq = "<leader>;" },
        { mode = "n", ctx = "global", seq = "<D-k>" }]

[[command]]
id = "cmdline.open"
ex = "cmdline"
desc = "command line"
tier = "local"
kind = "command"
ctx = ["global"]
keys = [{ mode = "n", ctx = "global", seq = ":" }, { mode = "v", ctx = "global", seq = ":" }]

[[command]]
id = "yank.clipboard"
ex = "yank-clip"
desc = "yank to clipboard"
tier = "local"
kind = "operator"
ctx = ["reader", "editor"]
keys = [{ mode = "n", ctx = "global", seq = "<leader>y" }, { mode = "v", ctx = "global", seq = "<leader>y" }]

[[command]]
id = "open.messages"
ex = "messages"
desc = "message history"
tier = "local"
kind = "command"
ctx = ["global"]
keys = []

[[command]]
id = "open.jumps"
ex = "jumps"
desc = "jumplist"
tier = "local"
kind = "command"
ctx = ["global"]
keys = []

[[command]]
id = "view.close"
ex = "q"
desc = "close item (drafts stay)"
tier = "local"
kind = "command"
ctx = ["global"]
note = ":q closes the open item the stage shows; x in the sidebar closes the one under the cursor. Drafts are device-local and survive closing, so it never asks. A place can't be closed."
keys = [{ mode = "n", ctx = "sidebar", seq = "x", shadows = "parent" }]

[[command]]
id = "app.quit"
ex = "qa"
desc = "quit (drafts stay)"
tier = "local"
kind = "command"
ctx = ["global"]
keys = []

[[command]]
id = "server.forget"
ex = "forget-server"
desc = "forget this server"
tier = "local"
kind = "command"
confirm_local = true
ctx = ["global"]
note = "Deletes the token from the Keychain and returns to Connect after a y/n confirm. The server still lists the device until it is revoked there."
keys = []

