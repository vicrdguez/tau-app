[[command]]
id = "link.external"
ex = "open-url"
desc = "open external link"
tier = "local"
kind = "command"
confirm_local = true
ctx = ["reader"]
keys = [{ mode = "n", ctx = "reader", seq = "gx" }]

[[command]]
id = "float.close"
