# ───────────────────────────── lists ─────────────────────────────

[[command]]
id = "list.open"
ex = "open"
desc = "open / edit under cursor"
tier = "local"
kind = "command"
jump = true
ctx = ["list", "reader"]
note = "A row: its object (an event: the conversation it names; a fault: its decision, else its conversation). In the sidebar: the place or open item, and the stage gets the keys. In readers: a details link, a #id, a choice (moves the cursor there), an option field (opens its editor or picker). In a conversation reader: toggles the foldable stop under the cursor, including tool rows, tool groups and thinking folds; does nothing on other stops or while composing."
keys = [{ mode = "n", ctx = "list", seq = "<CR>" }, { mode = "n", ctx = "list", seq = "l" }, { mode = "n", ctx = "reader", seq = "<CR>" }]

[[command]]
id = "group.next"
ex = "gnext"
desc = "next / prev group"
tier = "local"
kind = "motion"
object = "g"
jump = false
countable = true
ctx = ["list"]
keys = [{ mode = "n", ctx = "list", seq = "]g" }, { mode = "n", ctx = "list", seq = "[g" }]

[[command]]
id = "row.hide"
ex = "hide"
desc = "hide failure / forget entry"
tier = "local"
kind = "command"
local_only = true
ctx = ["list", "outbox"]
note = "A fault row or a failed-run row: hidden on this device until it fails again (x again shows it while ␣th is on). An outbox entry: forgotten on this device. Never a server call."
keys = [{ mode = "n", ctx = "list", seq = "x" }, { mode = "ob", ctx = "outbox", seq = "x" }]

# ───────────────────────────── conversation (␣c) ─────────────────────────────

[[command]]
id = "conv.new"
ex = "new"
desc = "new conversation"
tier = "local"
kind = "command"
jump = true
ctx = ["global"]
note = "Opens the start page in Insert. Its project: the one the current view names (a Project view, a conversation, a decision, or the sidebar item under the cursor), else the last one used on this device. Its workflow: the last one used in that project, else the project's only workflow, else the bare agent with a model. Nothing is sent until the start page's Cmd-Enter."
keys = [{ mode = "n", ctx = "global", seq = "<leader>cn" }]

[[command]]
id = "start.send"
ex = "start"
desc = "start the conversation"
tier = "write"
kind = "command"
ctx = ["start"]
wire = ["create", "input"]
note = "Sends create for the drawn project and workflow (or model), then input with the text; the page becomes that conversation. Empty or white-space text: nothing. Over 1 MiB: nothing is sent. Off, with the text read-only, from the press until create replies or times out; auto-repeat never fires it. A workflow whose options have errors opens them instead and keeps the text. A lost create reply is never resent (client.md §2.4)."
keys = [{ mode = "n", ctx = "start", seq = "<D-CR>", tui_alt = "<CR>" },
        { mode = "i", ctx = "start", seq = "<D-CR>", tui_alt = "<C-CR>" }]

[[command]]
id = "start.project"
ex = "project"
desc = "start page: project"
tier = "local"
kind = "command"
ctx = ["start"]
note = "The project picker for the start page, in Normal and in Insert (KL14 lets an Insert binding repeat its command's Option chord from Normal). Off while create is in flight."
keys = [{ mode = "n", ctx = "start", seq = "<M-p>", tui = "kitty", tui_alt = "<leader>pp" },
        { mode = "i", ctx = "start", seq = "<M-p>", tui = "kitty", tui_alt = "<leader>pp" }]

[[command]]
id = "start.workflow"
ex = "workflow"
desc = "start page: workflow or model"
tier = "local"
kind = "command"
ctx = ["start"]
note = "One flat list: the project's workflows, then one bare-agent row per model. In Normal and in Insert, like start.project. Off while create is in flight."
keys = [{ mode = "n", ctx = "start", seq = "<M-w>", tui = "kitty", tui_alt = "<leader>pw" },
        { mode = "i", ctx = "start", seq = "<M-w>", tui = "kitty", tui_alt = "<leader>pw" }]

[[command]]
id = "composer.focus"
ex = "compose"
desc = "write in composer"
tier = "local"
kind = "command"
ctx = ["conversation"]
keys = [{ mode = "n", ctx = "conversation", seq = "i" }, { mode = "n", ctx = "conversation", seq = "a" }, { mode = "n", ctx = "conversation", seq = "o" }]

[[command]]
id = "composer.send"
ex = "send"
desc = "send (or steer if running)"
tier = "write"
kind = "command"
ctx = ["composer"]
wire = ["input"]
note = "Idle or failed: input with no whenBusy. Running: whenBusy steer. Never whenIdle. Empty or white-space text: nothing. Bare Enter never sends from the composer; in a terminal client Enter in the composer's Normal mode is the fallback (tui_alt)."
keys = [{ mode = "n", ctx = "composer", seq = "<D-CR>", tui_alt = "<CR>" },
        { mode = "i", ctx = "composer", seq = "<D-CR>", tui_alt = "<C-CR>" }]

[[command]]
id = "composer.followup"
ex = "followup"
desc = "queue as follow-up"
tier = "write"
kind = "command"
ctx = ["composer", "conversation"]
wire = ["input"]
note = "input with whenBusy followUp."
keys = [{ mode = "n", ctx = "composer", seq = "<M-CR>", tui = "kitty", tui_alt = "<leader>cf" },
        { mode = "i", ctx = "composer", seq = "<M-CR>", tui = "kitty", tui_alt = "<leader>cf" },
        { mode = "n", ctx = "global", seq = "<leader>cf" }]

