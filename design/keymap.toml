[[command]]
id = "peek"
ex = "peek"
desc = "details"
tier = "local"
kind = "command"
ctx = ["global"]
note = "On a list row: the peek float when the stage is under 1000 px, with its own keys; at 1000 px and wider the peek is already the right column and K does nothing. On an open item in the sidebar: the peek float. On a field or a record: its full value. In the outbox: outbox.keys."
